<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared With Me - SaaS Cloud</title>
  <link rel="stylesheet" href="/mazer-assets/compiled/css/app.css">
  <link rel="stylesheet" href="/mazer-assets/compiled/css/app-dark.css">
  <link rel="stylesheet" href="/mazer-assets/compiled/css/iconly.css">
  <link rel="stylesheet" href="/mazer-assets/extensions/sweetalert2/sweetalert2.min.css">
</head>
<body>
  <script src="/mazer-assets/static/js/initTheme.js"></script>
  <div id="app">
    <div id="sidebar">
      <div class="sidebar-wrapper active">
        <div class="sidebar-header position-relative">
          <div class="d-flex justify-content-between align-items-center">
            <div class="logo"><a href="/dashboard" style="font-weight:800;font-size:1.5rem;color:#435ebe;">SaaS Cloud</a></div>
          </div>
        </div>
        <div class="sidebar-menu">
          <ul class="menu">
            <li class="sidebar-title">Menu</li>
            <li class="sidebar-item"><a href="/dashboard" class="sidebar-link"><i class="bi bi-grid-fill"></i><span>Dashboard</span></a></li>
            <li class="sidebar-item"><a href="/files-app" class="sidebar-link"><i class="bi bi-folder-fill"></i><span>My Files</span></a></li>
            <li class="sidebar-item active"><a href="/shared-app" class="sidebar-link"><i class="bi bi-share-fill"></i><span>Shared With Me</span></a></li>
            <li class="sidebar-item"><a href="/folder-app" class="sidebar-link"><i class="bi bi-diagram-3-fill"></i><span>Folder View</span></a></li>
            <li class="sidebar-item"><a href="#" id="logoutBtn" class="sidebar-link"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a></li>
          </ul>
        </div>
      </div>
    </div>

    <div id="main">
      <header class="mb-3">
        <a href="#" class="burger-btn d-block d-xl-none"><i class="bi bi-justify fs-3"></i></a>
      </header>

      <div class="page-heading">
        <h3>Shared With Me</h3>
      </div>

      <div class="page-content">
        <section class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h4>Incoming Shares</h4>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-hover table-lg">
                    <thead>
                      <tr>
                        <th>Item</th>
                        <th>Owner</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody id="sharedTableBody">
                      <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/frontend-js/api.js"></script>
  <script src="/frontend-js/auth.js"></script>
  <script src="/frontend-js/guard.js"></script>
  <script src="/frontend-js/shared.js"></script>
  <script src="/mazer-assets/extensions/sweetalert2/sweetalert2.min.js"></script>
  <script src="/mazer-assets/static/js/components/dark.js"></script>
  <script src="/mazer-assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js"></script>
  <script src="/mazer-assets/compiled/js/app.js"></script>
  <script>
    requireAuth();
    bindLogoutButton();
    loadSharedFiles();
  </script>
</body>
</html>
